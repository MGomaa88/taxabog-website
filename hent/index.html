<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hent TaxaBog</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16191d; color: #eef0f2;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p { color: #a3a3a3; margin: 0 0 24px; }
  a.btn { display: block; margin: 12px auto; max-width: 280px; padding: 14px 18px; border-radius: 12px;
          background: #FFC21A; color: #16191d; font-weight: 700; text-decoration: none; }
  a.alt { background: #262626; color: #eef0f2; }
  .small { font-size: 14px; margin-top: 20px; }
  .small a { color: #FFC21A; }
</style>
</head>
<body>
<main>
  <h1>Hent TaxaBog</h1>
  <p>Gratis vagtregnskab til taxa og flextrafik</p>
  <a class="btn" id="ios" href="https://apps.apple.com/app/taxabog-vagtregnskab/id6820941732">Hent i App Store</a>
  <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=dk.egydan.taxabog">Hent på Google Play</a>
  <p class="small"><a href="/">Læs mere på taxabog.dk</a></p>
</main>
<script>
  // Send people straight to the right store. Desktop browsers stay on this page.
  (function () {
    var ua = navigator.userAgent || "";
    var iOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (iOS) location.replace(document.getElementById("ios").href);
    else if (/Android/i.test(ua)) location.replace(document.getElementById("android").href);
  })();
</script>
</body>
</html>
